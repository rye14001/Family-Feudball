<style>

  *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--cream);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(ellipse at 50% 0,#134d91 0,#061a48 31%,#010817 78%)}
  body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.45;background-image:radial-gradient(circle at 5% 12%,#fff 0 1px,transparent 2px),radial-gradient(circle at 92% 28%,#fff 0 1px,transparent 2px),radial-gradient(circle at 17% 65%,#fff 0 1px,transparent 2px);background-size:17px 17px,22px 22px,27px 27px}
  .stage{width:min(1220px,96vw);margin:24px auto 18px;padding:12px;border:4px solid var(--gold2);border-radius:28px;background:linear-gradient(135deg,#081c50dd,#020a21ee);box-shadow:0 0 0 5px #713f06,0 0 55px #ffb82488,inset 0 0 60px #000a}
  .bulbs{height:15px;border-radius:12px;background:radial-gradient(circle,#fff7b5 0 3px,#ffd148 4px 5px,transparent 6px) 0 50%/25px 15px repeat-x;filter:drop-shadow(0 0 5px #ffd148);margin:1px 4px}
  header{text-align:center;padding:18px 16px 15px;position:relative;overflow:hidden;background:linear-gradient(90deg,#071536cc,#164e9ecc,#071536cc)}
  .header-side-art{position:absolute;top:50%;height:118px;width:auto;object-fit:contain;filter:drop-shadow(0 8px 12px #000b) drop-shadow(0 0 13px #ffd55866);will-change:transform}.header-helmet{left:3.5%;animation:helmet-pregame-float 3.8s ease-in-out infinite}.header-football{right:3.5%;animation:football-pregame-float 4.6s ease-in-out .35s infinite}@keyframes helmet-pregame-float{0%,100%{transform:translateY(-50%) rotate(-3deg)}50%{transform:translateY(calc(-50% - 7px)) rotate(2deg)}}@keyframes football-pregame-float{0%,100%{transform:translateY(-50%) rotate(3deg)}50%{transform:translateY(calc(-50% + 6px)) rotate(-3deg)}}
  .kicker{margin:0;color:#94d8ff;font-size:11px;letter-spacing:4px;font-weight:800}.logo{margin:2px 0 0;font-family:Georgia,serif;font-style:italic;font-weight:900;font-size:clamp(36px,7vw,78px);line-height:.9;letter-spacing:-4px;color:var(--gold);-webkit-text-stroke:2px #fff4c8;text-shadow:3px 3px 0 #b01d17,7px 7px 0 #061334,0 0 20px #ffb91c}.logo span{display:block;color:#fff8e5;-webkit-text-stroke:2px #f28d20;text-shadow:3px 3px 0 #b71f18,7px 7px 0 #061334,0 0 20px #ffe36a}.subtitle{margin:11px 0 0;color:#b4ddff;font-size:14px;font-weight:700;letter-spacing:1px}
  .prompt{margin:23px auto 14px;max-width:850px;text-align:center;font-family:Georgia,serif;font-weight:bold;font-size:clamp(17px,2.5vw,26px);text-transform:uppercase;color:#fff;letter-spacing:.5px;text-shadow:0 2px 3px #000}.prompt em{color:var(--gold);font-style:normal}
  .board{max-width:900px;margin:auto;padding:14px 18px 18px;border:7px solid var(--gold2);border-radius:18px;background:linear-gradient(145deg,#063683,#0b63bc 48%,#062b6d);box-shadow:inset 0 0 0 3px #d9f1ff,inset 0 0 34px #001a59,0 12px 32px #0009}
  .answers{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,auto) auto;grid-auto-flow:column;gap:9px}.answer{display:grid;grid-template-columns:42px 1fr 54px;align-items:center;min-height:57px;padding:5px;border:2px solid #8fd3ff;border-radius:5px;color:var(--cream);cursor:pointer;background:linear-gradient(90deg,#021735,#075fbe 35%,#06448e);box-shadow:inset 0 0 15px #0008,0 2px 0 #00245b;transition:transform .16s,filter .16s}.answer:hover,.answer:focus-visible{transform:scale(1.025);filter:brightness(1.25);outline:2px solid var(--gold)}.answer.open{background:linear-gradient(90deg,#0a4e9a,#1483e5,#0a4e9a);border-color:var(--gold);box-shadow:inset 0 0 15px #bcecff55,0 0 15px #ffce3d99}.num{border-right:2px solid #6dbcf0;font:bold 27px/1 Impact,Arial;color:var(--gold);text-shadow:2px 2px #89170e}.answer-name{padding:0 10px;font:bold clamp(13px,2vw,17px)/1.05 Arial;letter-spacing:.4px;text-align:left}.points{padding-left:4px;border-left:2px solid #6dbcf0;text-align:center;font:bold 22px/1 Impact,Arial;color:#fff8dd;text-shadow:1px 2px 0 #06234f}.more{grid-column:1/-1;grid-row:5;margin-top:2px;font-size:12px;color:#d6efff;text-align:center;letter-spacing:1px}
  .strike-overlay{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;visibility:hidden;opacity:0;pointer-events:none;background:rgba(0,5,24,.18);transition:opacity .14s,visibility 0s .55s}.strike-overlay.show{visibility:visible;opacity:1;transition:opacity .08s}.strike-card{display:grid;place-items:center;gap:12px;filter:drop-shadow(0 12px 28px #000c)}.strike-x{display:grid;place-items:center;width:min(190px,44vw);aspect-ratio:1;border:12px solid #ffae91;border-radius:24px;color:#fff3ed;background:linear-gradient(145deg,#ff493b,#b40812);box-shadow:inset 0 0 0 5px #6d0009,0 0 0 6px #ff493b,0 0 52px #ff291dcc;font:900 min(150px,35vw)/1 Arial;text-shadow:4px 6px 0 #76000a;transform:rotate(-5deg)}.strike-overlay.show .strike-x{animation:strike-pop .62s cubic-bezier(.18,.82,.3,1.28)}.strike-caption{padding:8px 16px;border:2px solid #ff9b83;border-radius:8px;color:#fff;background:#39060be8;font:900 14px Arial;letter-spacing:1.7px;text-transform:uppercase}.strike-overlay.show .strike-caption{animation:strike-caption .7s ease both}@keyframes strike-pop{0%{transform:scale(.15) rotate(-18deg);opacity:0}58%{transform:scale(1.16) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(-5deg)}}@keyframes strike-caption{0%,35%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
  .content{margin:20px auto 4px;max-width:1050px;min-height:0;border:3px solid #378bd4;border-radius:14px;background:linear-gradient(145deg,#06183d,#0a2860);box-shadow:inset 0 0 40px #0008;padding:18px}.loading{text-align:center;padding:70px 10px;color:#bce4ff;font-size:17px}.view-title{display:flex;justify-content:space-between;gap:12px;align-items:end;border-bottom:2px solid var(--gold);padding:0 0 9px;margin:0 0 14px;font-family:Georgia,serif;font-size:24px;color:var(--gold)}.view-title small{font:700 12px Arial;color:#9bd5ff;text-transform:uppercase;letter-spacing:1px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{min-height:92px;padding:12px;border:1px solid #408fd2;border-radius:8px;background:linear-gradient(145deg,#0c4d96,#061d52)}.tile label{display:block;color:#aad9ff;font-size:10px;font-weight:bold;text-transform:uppercase;letter-spacing:1px}.tile strong{display:block;margin-top:7px;font:25px/1 Georgia,serif;color:#fff}.tile p{margin:5px 0 0;font-size:12px;color:#d1ecff}.table-wrap{overflow:auto;border:1px solid #3b92df;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:540px}th{padding:9px;background:#ffc928;color:#1a190c;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.8px}td{padding:8px;border-top:1px solid #2467aa;font-size:13px;color:#e9f7ff}tbody tr:nth-child(even){background:#0b3571}tbody tr:hover{background:#10569b}.win{color:#aaf6a4;font-weight:bold}.loss{color:#ffb3a7;font-weight:bold}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:0 0 12px}select,button.control{padding:8px 10px;border:1px solid #75bded;border-radius:6px;background:#08275a;color:#fff;font-weight:bold}.callout{padding:13px 15px;border-left:5px solid var(--gold);background:#0c3471;color:#dff3ff;border-radius:5px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rank{font:bold 18px Georgia,serif;color:var(--gold);margin-right:9px}.wheel{width:min(330px,80vw);aspect-ratio:1;border-radius:50%;margin:10px auto 16px;border:10px solid var(--gold);background:conic-gradient(#e93430 0 45deg,#135cbc 45deg 90deg,#eea01d 90deg 135deg,#2bb77c 135deg 180deg,#9c3fc7 180deg 225deg,#e83d70 225deg 270deg,#3378d6 270deg 315deg,#e2761c 315deg);box-shadow:0 0 0 5px #8d4805,0 0 35px #ffcb3b99;display:grid;place-items:center}.wheel:before{content:"";width:34%;height:34%;border-radius:50%;background:#06183d;border:5px solid #fff2a2;box-shadow:0 0 12px #fff}.spin{text-align:center}.spin button{padding:12px 22px;border:2px solid #ffe984;border-radius:7px;color:#17234b;background:linear-gradient(#ffed8e,#ffab22);font:bold 16px Arial;cursor:pointer}.winner{min-height:28px;margin-top:10px;color:#fff1a3;font:bold 20px Georgia,serif}.error{padding:18px;border:1px solid #ec6e5f;background:#4d171d;color:#ffe4df;border-radius:8px}
  @media(max-width:700px){body{overflow-x:hidden}.stage{width:100%;margin:0;padding:8px;border-radius:0;border-left:0;border-right:0}.bulbs{height:11px;margin:0 2px}header{padding:13px 8px 12px}.header-side-art{display:none}.kicker{font-size:9px;letter-spacing:3px}.logo{font-size:clamp(32px,11vw,48px);letter-spacing:-2px;-webkit-text-stroke-width:1px;text-shadow:2px 2px 0 #b01d17,4px 4px 0 #061334,0 0 14px #ffb91c}.logo span{-webkit-text-stroke-width:1px;text-shadow:2px 2px 0 #b71f18,4px 4px 0 #061334,0 0 14px #ffe36a}.subtitle{margin-top:8px;padding:0 8px;font-size:12px;line-height:1.25}.prompt{margin:14px 7px 10px;font-size:16px;line-height:1.18}.board{width:100%;padding:9px;border-width:5px;border-radius:14px}.answers{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,auto) auto;grid-auto-flow:column;gap:6px}.answer{grid-template-columns:30px minmax(0,1fr);min-width:0;min-height:49px;padding:4px}.num{font-size:22px}.answer-name{min-width:0;padding:0 6px;font-size:11px;line-height:1.1;overflow-wrap:anywhere}.points{display:none}.more{grid-row:5;margin-top:4px;font-size:9px}.twocol{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr 1fr}.content{min-width:0;margin-top:12px;padding:7px;border-width:2px}.view-title{align-items:flex-start;font-size:20px}.view-title small{display:none}.detail-frame{max-width:100%;border-radius:6px}}
  @media(prefers-reduced-motion:reduce){.strike-overlay.show .strike-x,.strike-overlay.show .strike-caption,.header-side-art{animation:none}}
  .detail-frame{display:block;width:100%;height:360px;border:0;border-radius:9px;background:#020b20}
  body.modal-open{overflow:hidden}
  .draft-detail-modal[hidden]{display:none}
  .draft-detail-modal{position:fixed;inset:0;z-index:10050;display:grid;place-items:center;padding:22px;background:rgba(0,5,20,.82);backdrop-filter:blur(5px)}
  .draft-detail-dialog{display:flex;flex-direction:column;width:min(1040px,96vw);max-height:min(88vh,900px);overflow:hidden;border:3px solid var(--gold2);border-radius:18px;background:linear-gradient(145deg,#081d4d,#020a20);box-shadow:0 22px 80px #000,0 0 35px #ffbd2d44}
  .draft-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:20px 22px 15px;border-bottom:1px solid #2d69a5;background:linear-gradient(90deg,#102d66,#071538)}
  .draft-detail-kicker{margin:0 0 4px;color:var(--gold);font-size:11px;font-weight:900;letter-spacing:1.6px;text-transform:uppercase}
  .draft-detail-head h2{margin:0;color:#fff;font:800 clamp(22px,3vw,31px)/1.12 Georgia,serif}
  .draft-detail-subtitle{margin:7px 0 0;color:#a9cff2;font-size:13px;line-height:1.45}
  .draft-detail-close{flex:0 0 auto;width:42px;height:42px;border:1px solid #75bded;border-radius:50%;color:#fff;background:#092858;font:700 25px/1 Arial;cursor:pointer}
  .draft-detail-close:hover,.draft-detail-close:focus-visible{border-color:var(--gold);color:var(--gold);outline:2px solid var(--gold)}
  .draft-detail-body{overflow:auto;padding:18px 22px 23px;overscroll-behavior:contain}
  .draft-detail-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:16px}
  .draft-detail-stat{padding:11px 12px;border:1px solid #285f99;border-radius:8px;background:#092557}
  .draft-detail-stat span{display:block;color:#88b8e6;font-size:9px;font-weight:800;letter-spacing:.75px;text-transform:uppercase}
  .draft-detail-stat b{display:block;margin-top:5px;color:#fff;font:800 19px/1.15 Georgia,serif}
  .draft-detail-note{margin:0 0 13px;padding:11px 13px;border-left:4px solid var(--gold);border-radius:5px;color:#cbe5ff;background:#0b2a61;font-size:12px;line-height:1.5}
  .draft-detail-tablewrap{overflow:auto;border:1px solid #367bb7;border-radius:9px;background:#061635}
  .draft-detail-table{min-width:790px}
  .draft-detail-table th{background:#ffc928;color:#171307}
  .draft-detail-table td{padding:10px 9px;font-size:12px}
  .draft-detail-player{font-weight:800;color:#fff}
  .draft-detail-pill{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:4px 7px;border-radius:999px;background:#123f7c;color:#cfeaff;font-size:10px;font-weight:800;white-space:nowrap}
  .draft-detail-pill.yes{background:#175b4f;color:#9ff4ce}.draft-detail-pill.no{background:#542936;color:#ffb8c1}.draft-detail-pill.credit{background:#57420a;color:#ffe286}
  .draft-detail-empty{padding:30px 18px;text-align:center;color:#b9d9f7}
  @media(max-width:700px){
    .draft-detail-modal{padding:7px}.draft-detail-dialog{width:100%;max-height:94vh;border-radius:13px}.draft-detail-head{padding:15px 14px 12px}.draft-detail-close{width:38px;height:38px}.draft-detail-body{padding:12px}
    .draft-detail-summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.draft-detail-stat{padding:9px}.draft-detail-stat b{font-size:17px}
    .draft-detail-table{display:block;min-width:0}.draft-detail-table thead{display:none}.draft-detail-table tbody{display:grid;gap:8px;padding:8px}.draft-detail-table tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid #275d96;border-radius:8px;background:#0a285c;overflow:hidden}.draft-detail-table td{display:flex;min-width:0;flex-direction:column;gap:4px;padding:8px;border:0;overflow-wrap:anywhere}.draft-detail-table td::before{content:attr(data-label);color:#7faedb;font-size:8px;font-weight:900;letter-spacing:.65px;text-transform:uppercase}.draft-detail-table td.player-cell{grid-column:1/-1;background:#0d3472}.draft-detail-table td.player-cell::before{display:none}.draft-detail-player{font-size:15px}
  }
</style>

<body>
<main class="stage">
  <div class="bulbs"></div>
  <header><img class="header-side-art header-helmet" src="assets/bills-helmet.png" alt="Buffalo Bills helmet"><p class="kicker">THE LEAGUE SURVEY BOARD</p><div class="logo">FAMILY <span>FEUDBALL</span></div><p class="subtitle">Name the best way to relive the league… the board has the answers!</p><img class="header-side-art header-football" src="assets/football.png" alt="Football"></header>
  <p class="prompt">We asked 100 family members: <em>“Why is trash talk a Family Feudball tradition?”</em></p>
  <section class="board" aria-label="Family Feudball answer board"><div class="answers" id="answers"></div></section>
  <section class="content" id="content" aria-live="polite"><div class="loading">Lighting the board and loading the league survey…</div></section>
</main>

    <div class="draft-detail-head"><div><p class="draft-detail-kicker" id="draft-detail-kicker">Draft Room Receipt</p><h2 id="draft-detail-title">Manager details</h2><p class="draft-detail-subtitle" id="draft-detail-subtitle"></p></div><button type="button" class="draft-detail-close" id="draft-detail-close" aria-label="Close player details">×</button></div>
    <div class="draft-detail-body" id="draft-detail-body"></div>
  </section>
</div>

  const method='<details class="draft-method"><summary>How the grades work — and how to use them for 2026</summary><p><b>Draft foundation</b> rewards starter points from original picks, round-adjusted value, and useful contributors. <b>Roster management</b> rewards points supplied by additions plus lineup efficiency. <b>Finished build</b> uses Weeks 14–17 scoring, season-long potential points, and playoff placement. Every score is relative to the other seven teams that season, so the letters compare league builds rather than pretending to be universal player grades.</p><p>For the next draft, pair these receipts with value over replacement and positional scarcity: compare a player with the last startable option at that position, then spend early capital where the drop-off is steepest. See the <a href="https://www.fantasypros.com/2025/06/fantasy-football-draft-strategy-value-based-drafting-vorp-vols-vona/amp/" target="_blank" rel="noopener">VORP/VOLS explanation</a> and <a href="https://www.fantasypros.com/2025/08/fantasy-football-draft-strategy-ideal-roster-construction/amp/" target="_blank" rel="noopener">roster-construction guide</a>. Source ownership, picks, and weekly starter data come from the <a href="https://docs.sleeper.com/" target="_blank" rel="noopener">Sleeper API</a>.</p></details>';
  root.innerHTML=overview+'<div class="draft-analysis-grid">'+teams.map(function(team,index){return draftBuildCard(team,index,season);}).join('')+'</div>'+lessons+method;
  root.querySelectorAll('.draft-grade-cell.actionable').forEach(function(button){button.addEventListener('click',function(){window.parent.postMessage({type:'feudboard-draft-detail',kind:button.dataset.detailKind,manager:button.dataset.detailManager,season:button.dataset.detailSeason},'*');});});
}
`;
      source=source
        .replace("document.getElementById('standings-full').innerHTML =", "const standingsFull=document.getElementById('standings-full');\n  if(standingsFull) standingsFull.innerHTML =")

      source=source.replace('function renderStandingsDraft(season){',draftAnalysisRuntime+'\nfunction renderStandingsDraft(season){\n  renderDraftTeamAnalysis(season);');

        .replace(/(<span class="lottery-roster-status"[^>]*>[\s\S]*?<\/span>\s*<\/div>)\s*<\/div>\s*<div class="lottery-countdown-panel card">/,'$1\n        <div class="lottery-countdown-panel">')
        .replace(/(<strong class="long" id="lottery-countdown">[\s\S]*?<\/strong>\s*<\/div>)(\s*<div class="lottery-machine card">)/,'$1\n      </div>$2')

    return detailViewPromise;
  }
  async function render(){
    const c=$('#content'), wanted=active, page=pages.find(p=>p[2]===wanted), frame=$('#detail-frame');
    if(frame){
      const title=c.querySelector('.view-title > span'), note=c.querySelector('.view-title > small');
      if(title)title.textContent=page[0]; if(note)note.textContent='full Family Feudball detail';
      frame.title='Family Feudball '+wanted+' detail';
      frame.contentWindow.postMessage({type:'feudboard-tab',tab:wanted,season:selectedSeason},'*');
      return;
    }
    const version=++renderVersion;
    c.innerHTML='<div class="loading">Revealing the full '+esc(page[0])+' board…</div>';
    try{
      const srcdoc=await readDetailView();
      if(version!==renderVersion)return;
      const current=active, currentPage=pages.find(p=>p[2]===current);
      c.innerHTML=heading(currentPage[0],'full Family Feudball detail')+'<iframe class="detail-frame" id="detail-frame" scrolling="no" title="Family Feudball '+esc(current)+' detail"></iframe>';
      const liveFrame=$('#detail-frame');
      liveFrame.addEventListener('load',()=>liveFrame.contentWindow.postMessage({type:'feudboard-tab',tab:active,season:selectedSeason},'*'),{once:true});
      liveFrame.srcdoc=srcdoc;
    }catch(err){if(version===renderVersion)c.innerHTML='<div class="error"><b>The full detail board could not be opened.</b><br><br>'+esc(err.message)+'</div>';}
  }
  window.addEventListener('message',event=>{
    const msg=event.data;
    if(msg&&msg.type==='feudboard-draft-detail'&&['2024','2025'].includes(msg.season)&&['draft','moves'].includes(msg.kind)) openDraftDetail(msg.season,msg.manager,msg.kind);
    if(msg&&msg.type==='feudboard-season'&&['2024','2025'].includes(msg.season)) selectedSeason=msg.season;
    if(msg&&msg.type==='feudboard-state'){
      if(['2024','2025'].includes(msg.season)) selectedSeason=msg.season;
      const frame=$('#detail-frame');
      if(frame){
        if(Number.isFinite(msg.height)) frame.style.height=Math.max(240,Math.min(16000,Math.ceil(msg.height)))+'px';
        frame.dataset.activeTab=msg.tab||'';
        frame.dataset.itemCount=String(msg.itemCount||0);
      }
    }
    if(msg&&msg.type==='feudboard-lottery-state'){
      const next=Boolean(msg.active); if(next!==lotteryBoardActive){lotteryBoardActive=next;renderBoard();}
    }
    if(msg&&msg.type==='feudboard-height'&&Number.isFinite(msg.height)){
      const frame=$('#detail-frame'); if(frame) frame.style.height=Math.max(240,Math.min(16000,Math.ceil(msg.height)))+'px';
    }
  });
  $('#draft-detail-close').addEventListener('click',closeDraftDetail);
  $('#draft-detail-modal').addEventListener('click',event=>{if(event.target.id==='draft-detail-modal')closeDraftDetail()});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('#draft-detail-modal').hidden)closeDraftDetail()});
  function recap(){ const f=site.fun_facts, st=standings('2025'); return heading('Season Recap','2024–2025 league history')+`<div class="stat-grid"><div class="tile"><label>2025 Champion</label><strong>${esc(st[0].team)}</strong><p>${st[0].w}–${st[0].l} record</p></div><div class="tile"><label>High Score</label><strong>${n(f.highest_score.score)}</strong><p>${esc(f.highest_score.team)}, ${f.highest_score.season} Week ${f.highest_score.week}</p></div><div class="tile"><label>Closest Finish</label><strong>${n(f.closest_game.margin)}</strong><p>${esc(f.closest_game.teamA)} vs ${esc(f.closest_game.teamB)}</p></div><div class="tile"><label>Biggest Blowout</label><strong>${n(f.biggest_blowout.margin)}</strong><p>${esc(f.biggest_blowout.teamA)} over ${esc(f.biggest_blowout.teamB)}</p></div></div><div class="callout" style="margin-top:15px">The board draws directly from the original command center’s season matchups, standings, draft history, awards, activity, and scoring-settings data.</div>`; }
  function matchups(){ const y='2025', games=site.season_matchups[y]; return heading('Matchups','reveal the scores')+`<div class="controls">${select('year',['2024','2025'],y)} <span>Every regular-season head-to-head result.</span></div>`+table(['Week','Team','Score','Opponent','Score','Result'],games.map(([w,a,sa,b,sb])=>`<tr><td>${w}</td><td>${esc(a)}</td><td>${n(sa)}</td><td>${esc(b)}</td><td>${n(sb)}</td><td class="${sa>sb?'win':'loss'}">${sa>sb?'WIN':'LOSS'}</td></tr>`)); }
  function standingsView(){ const y='2025'; return heading('Standings','final regular-season order')+`<div class="controls">${select('stand-year',['2024','2025'],y)}</div>`+table(['#','Team','Record','PF','PA'],standings(y).map(r=>`<tr><td><span class="rank">${r.rank}</span></td><td>${esc(r.team)}</td><td class="win">${r.w}–${r.l}</td><td>${n(r.pf)}</td><td>${n(r.pa)}</td></tr>`)); }
  function records(){ const rivals=awards.rivalries.slice().sort((a,b)=>b.games-a.games||Math.abs(b.winsA-b.winsB)-Math.abs(a.winsA-a.winsB)).slice(0,10), f=site.fun_facts; return heading('Records & Rivalries','the all-time ledger')+`<div class="stat-grid"><div class="tile"><label>Highest Score</label><strong>${n(f.highest_score.score)}</strong><p>${esc(f.highest_score.team)}</p></div><div class="tile"><label>Lowest Score</label><strong>${n(f.lowest_score.score)}</strong><p>${esc(f.lowest_score.team)}</p></div><div class="tile"><label>Closest Game</label><strong>${n(f.closest_game.margin)}</strong><p>Week ${f.closest_game.week}, ${f.closest_game.season}</p></div><div class="tile"><label>Largest Margin</label><strong>${n(f.biggest_blowout.margin)}</strong><p>Week ${f.biggest_blowout.week}, ${f.biggest_blowout.season}</p></div></div><h3>Top Rivalries</h3>`+table(['Matchup','Games','Series','Closest Game'],rivals.map(r=>`<tr><td>${esc(r.teamA)} vs ${esc(r.teamB)}</td><td>${r.games}</td><td>${r.winsA}–${r.winsB}</td><td>${n(r.closest.margin)} pts (${r.closest.season} W${r.closest.week})</td></tr>`)); }
  function managers(){const leader=awards.efficiency_leaderboard.slice().sort((a,b)=>b.avg_efficiency-a.avg_efficiency), activity=awards.activity.slice().sort((a,b)=>b.waiver_moves-a.waiver_moves);return heading('Managers & Awards','who ran the board?')+`<div class="twocol"><div><h3>Lineup Efficiency</h3>${table(['#','Manager','Efficiency'],leader.slice(0,8).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.team)}</td><td>${(r.avg_efficiency*100).toFixed(1)}%</td></tr>`))}</div><div><h3>Waiver Wire Activity</h3>${table(['#','Manager','Moves'],activity.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.team)}</td><td>${r.waiver_moves}</td></tr>`))}</div></div><div class="callout" style="margin-top:16px"><b>Biggest blunder:</b> ${esc(awards.biggest_blunder.team)}, ${awards.biggest_blunder.season} Week ${awards.biggest_blunder.week} — left ${n(awards.biggest_blunder.bench_points)} potential points on the bench. Best unused player: ${esc(awards.biggest_blunder.best_bench_name)} (${n(awards.biggest_blunder.best_bench_pts)}).</div>`}
  function draft(){const y='2025', picks=site.draft_results[y];return heading('Draft Results','the board’s picks')+`<div class="controls">${select('draft-year',['2024','2025','2026'],y)}</div>`+table(['Pick','Round','Team','Player','Pos.','NFL'],picks.map(p=>`<tr><td>${p.pick_no}</td><td>${p.round}</td><td>${esc(p.team)}</td><td>${esc(p.player)}</td><td>${esc(p.pos)}</td><td>${esc(p.nfl_team)}</td></tr>`));}
  function label(field){return field.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())}
  function rules(){const rows=site.changed_settings.filter(r=>r.y2024!==r.y2025||r.y2025!==r.y2026);return heading('Rule Simulator','scoring settings history')+`<div class="callout">These are all scoring fields changed across 2024, 2025, and the current 2026 rule set. The original dataset contains ${site.adjustable_fields.length} adjustable fields and ${site.sim_team_weeks_2025.length} team-weeks of simulation data.</div><div style="height:14px"></div>`+table(['Setting','2024','2025','2026 Current'],rows.map(r=>`<tr><td>${label(r.field)}</td><td>${n(r.y2024)}</td><td>${n(r.y2025)}</td><td>${n(r.y2026)}</td></tr>`));}
  function wheel(){return heading('Draft Wheel','spin for pick #1')+`<div class="wheel"></div><div class="spin"><button id="spin">SPIN THE WHEEL</button><div class="winner" id="winner">${wheelTeams.length} teams ready</div></div><div class="controls" style="justify-content:center;margin-top:16px">${select('wheel-team',wheelTeams,wheelTeams[0]||'')} <button class="control" id="remove">Remove selected team</button><button class="control" id="reset">Reset</button></div>`}
  function bind(){
    const y=$('#year'); if(y)y.onchange=e=>{const games=site.season_matchups[e.target.value];$('#content').innerHTML=heading('Matchups',e.target.value+' regular season')+`<div class="controls">${select('year',['2024','2025'],e.target.value)}</div>`+table(['Week','Team','Score','Opponent','Score','Result'],games.map(([w,a,sa,b,sb])=>`<tr><td>${w}</td><td>${esc(a)}</td><td>${n(sa)}</td><td>${esc(b)}</td><td>${n(sb)}</td><td class="${sa>sb?'win':'loss'}">${sa>sb?'WIN':'LOSS'}</td></tr>`));bind();};
    const sy=$('#stand-year');if(sy)sy.onchange=e=>{$('#content').innerHTML=heading('Standings',e.target.value+' final order')+`<div class="controls">${select('stand-year',['2024','2025'],e.target.value)}</div>`+table(['#','Team','Record','PF','PA'],standings(e.target.value).map(r=>`<tr><td><span class="rank">${r.rank}</span></td><td>${esc(r.team)}</td><td class="win">${r.w}–${r.l}</td><td>${n(r.pf)}</td><td>${n(r.pa)}</td></tr>`));bind();};
    const dy=$('#draft-year');if(dy)dy.onchange=e=>{const picks=site.draft_results[e.target.value];$('#content').innerHTML=heading('Draft Results',e.target.value+' selections')+`<div class="controls">${select('draft-year',['2024','2025','2026'],e.target.value)}</div>`+table(['Pick','Round','Team','Player','Pos.','NFL'],picks.map(p=>`<tr><td>${p.pick_no}</td><td>${p.round}</td><td>${esc(p.team)}</td><td>${esc(p.player)}</td><td>${esc(p.pos)}</td><td>${esc(p.nfl_team)}</td></tr>`));bind();};
    const spin=$('#spin');if(spin)spin.onclick=()=>{if(!wheelTeams.length)return;const w=wheelTeams[Math.floor(Math.random()*wheelTeams.length)];$('#winner').textContent='★ '+w+' wins Pick #1! ★'};
    const remove=$('#remove');if(remove)remove.onclick=()=>{const s=$('#wheel-team').value;wheelTeams=wheelTeams.filter(t=>t!==s);render()}; const reset=$('#reset');if(reset)reset.onclick=()=>{wheelTeams=[...site.current_teams_2026];render()};
  }
  load();
})();
